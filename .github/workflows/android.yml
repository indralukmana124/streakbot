
name: Build StreakBot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Detect project folder
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          elif [ -f StreakBot/settings.gradle.kts ]; then
            echo "PROJECT_DIR=StreakBot" >> $GITHUB_ENV
          else
            echo "Project Android tidak ditemukan!"
            exit 1
          fi

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreakBot-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
